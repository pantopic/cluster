syntax = "proto3";

package cluster.api.v1;

service ResourceService {
  rpc Delete(ResourceServiceDeleteRequest) returns (ResourceServiceDeleteResponse) {}
  rpc Get(ResourceServiceGetRequest) returns (ResourceServiceGetResponse) {}
  rpc Put(ResourceServicePutRequest) returns (ResourceServicePutResponse) {}
  rpc List(ResourceServiceListRequest) returns (ResourceServiceListResponse) {}
}

message Resource {
  uint64 id = 1;
  uint64 created = 2;
  uint64 updated = 3;
  uint64 namespace_id = 4;
  string name = 5;
  map<string, string> tags = 6;
}

message ResourceServiceDeleteRequest {
  string id = 1;
}
message ResourceServiceDeleteResponse {
  uint64 code = 1;
  string error = 2;
}

message ResourceServiceGetRequest {
  string name = 1;
}
message ResourceServiceGetResponse {
  uint64 code = 1;
  string error = 2;
  Resource item = 3;
}

message ResourceServicePutRequest {
  Resource item = 1;
}
message ResourceServicePutResponse {
  uint64 code = 1;
  string error = 2;
  Resource item = 3;
}

message ResourceServiceListRequest {
  uint64 limit = 1;
  uint64 offset = 2;
}
message ResourceServiceListResponse {
  uint64 code = 1;
  string error = 2;
  repeated Resource item = 3;
}
