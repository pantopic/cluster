syntax = "proto3";

package cluster.api.v1;

service NamespaceService {
  rpc Delete(NamespaceServiceDeleteRequest) returns (NamespaceServiceDeleteResponse) {}
  rpc Get(NamespaceServiceGetRequest) returns (NamespaceServiceGetResponse) {}
  rpc Put(NamespaceServicePutRequest) returns (NamespaceServicePutResponse) {}
  rpc List(NamespaceServiceListRequest) returns (NamespaceServiceListResponse) {}
}

message Namespace {
  uint64 id = 1;
  uint64 created = 2;
  uint64 updated = 3;
  string name = 4;
  map<string, string> tags = 5;
}

message NamespaceServiceDeleteRequest {
  string id = 1;
}
message NamespaceServiceDeleteResponse {
  uint64 code = 1;
  string error = 2;
}

message NamespaceServiceGetRequest {
  string name = 1;
}
message NamespaceServiceGetResponse {
  uint64 code = 1;
  string error = 2;
  Namespace item = 3;
}

message NamespaceServicePutRequest {
  Namespace item = 1;
}
message NamespaceServicePutResponse {
  uint64 code = 1;
  string error = 2;
  Namespace item = 3;
}

message NamespaceServiceListRequest {
  uint64 limit = 1;
  uint64 offset = 2;
}
message NamespaceServiceListResponse {
  uint64 code = 1;
  string error = 2;
  repeated Namespace item = 3;
}
