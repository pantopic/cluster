x-variables:
  common: &common
    build:
      context: ../..
      dockerfile: cmd/standalone/Dockerfile
      target: standalone
    networks:
      - pantopic
    volumes:
      - type: tmpfs
        target: /var/lib/pantopic
        tmpfs:
          mode: 01777
    deploy:
      resources:
        limits:
          memory: 1G
  env: &env
    PANTOPIC_HOST_PEERS: pantopic-0,pantopic-1,pantopic-2
    PANTOPIC_HOST_TAGS: cluster:member
    PANTOPIC_LOG_LEVEL: warn # (info, debug)

services:
  pantopic-0:
    <<: *common
    environment:
      <<: *env
      PANTOPIC_HOST_NAME: pantopic-0
    ports:
      - 7091:7091
      - 9090:9090
      - 19000:19000
  pantopic-1:
    <<: *common
    environment:
      <<: *env
      PANTOPIC_HOST_NAME: pantopic-1
    ports:
      - 7092:7091
      - 9091:9090
      - 19001:19000
  pantopic-2:
    <<: *common
    environment:
      <<: *env
      PANTOPIC_HOST_NAME: pantopic-2
    ports:
      - 7093:7091
      - 9092:9090
      - 19002:19000

networks:
  pantopic:
